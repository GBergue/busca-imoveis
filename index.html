<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busca de Imóveis</title>
<style>
  :root { color-scheme: light dark; --bd: #8883; --mut: #8886; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .barra input, .barra select { padding: 6px 8px; border: 1px solid var(--bd); border-radius: 6px; font: inherit; background: transparent; color: inherit; }
  .barra input[type=number] { width: 120px; }
  .resumo { color: var(--mut); margin-bottom: 12px; }
  .resumo b { color: inherit; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--bd); vertical-align: top; }
  th { position: sticky; top: 0; background: Canvas; cursor: pointer; white-space: nowrap; user-select: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th[aria-sort=ascending]::after { content: " ▲"; }
  th[aria-sort=descending]::after { content: " ▼"; }
  tr:hover td { background: #8881; }
  img { width: 96px; height: 68px; object-fit: cover; border-radius: 4px; display: block; background: #8882; }
  a { color: inherit; }
  .tags { color: var(--mut); font-size: 12px; }
  .erro td { color: #c33; }
  .vazio { color: var(--mut); padding: 40px 0; }
  #ordenar { display: none; }
  .tbwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 12px; font-size: 13px; }
  .cats label { white-space: nowrap; cursor: pointer; }
  .cats:empty { display: none; }
  #editbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 13px; color: var(--mut); }
  #editbar button { padding: 4px 8px; border: 1px solid var(--bd); border-radius: 6px; font: inherit; background: transparent; color: inherit; cursor: pointer; }
  td[contenteditable] { outline: none; }
  td[contenteditable]:focus { background: #6cf3; box-shadow: inset 0 0 0 1px #6cf; }

  @media (max-width: 700px) {
    body { padding: 12px; }
    h1 { font-size: 16px; }
    .barra { flex-direction: column; align-items: stretch; }
    .barra input, .barra select { width: 100%; padding: 10px; }
    .barra input[type=number] { width: 100%; }
    #ordenar { display: block; }

    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tr { border: 1px solid var(--bd); border-radius: 8px; margin-bottom: 10px; padding: 10px; }
    tr:hover td { background: transparent; }
    td { border: none; padding: 3px 0; text-align: left; }
    td.num { text-align: left; }
    td:empty { display: none; }
    td[data-label]::before { content: attr(data-label) ": "; color: var(--mut); }
    td.foto img { width: 100%; height: auto; max-height: 220px; }
    .erro td { padding: 3px 0; }
  }
</style>
</head>
<body>
<h1>Busca de Imóveis</h1>
<p><a href="financiamento.html">financiamento vs investimento →</a></p>

<div class="barra">
  <input id="q" type="search" placeholder="bairro, condomínio, título…">
  <select id="quartos">
    <option value="">quartos (todos)</option>
    <option value="1">1+</option><option value="2">2+</option>
    <option value="3">3+</option><option value="4">4+</option>
  </select>
  <input id="pmin" type="number" placeholder="preço mín">
  <input id="pmax" type="number" placeholder="preço máx">
  <select id="ordenar" aria-label="ordenar por"></select>
</div>

<div class="cats" id="cats"></div>
<div id="editbar" hidden>
  <span>✏️ edição local ativa — clique numa célula pra editar</span>
  <button type="button" id="baixar">baixar overrides.json</button>
  <button type="button" id="limpar">limpar edições</button>
</div>

<div class="resumo" id="resumo"></div>

<div class="tbwrap">
<table>
  <thead><tr id="cab"></tr></thead>
  <tbody id="corpo"></tbody>
</table>
</div>
<div class="vazio" id="vazio" hidden>Nenhum imóvel. Rode <code>node scrape.mjs &lt;url&gt;</code> e recarregue.</div>

<script src="data.js"></script>
<script src="condominios.js"></script>
<script>
const COND_AMEN = {
  elevador: "elevador", portaria: "portaria", piscina: "piscina",
  churrasqueira: "churrasqueira", playground: "playground", academia: "academia",
  salao_festas: "salão de festas", salao_jogos: "salão de jogos", quadra: "quadra",
};

function achaCond(r) {
  const hay = `${r.titulo} ${r.descricao} ${r.endereco || ""} ${r.bairro || ""} ${r.url}`.toLowerCase();
  const c = (window.CONDOMINIOS || []).find(c => c.match.some(m => hay.includes(m)));
  return c ? c.nome : "";
}

function condTitle(nome) {
  const c = (window.CONDOMINIOS || []).find(c => c.nome === nome);
  if (!c) return "";
  const tem = Object.keys(COND_AMEN).filter(k => c[k] === true).map(k => COND_AMEN[k]);
  const nao = Object.keys(COND_AMEN).filter(k => c[k] === false).map(k => COND_AMEN[k]);
  return [
    tem.length ? "tem: " + tem.join(", ") : "",
    nao.length ? "não tem: " + nao.join(", ") : "",
    c.obs || "",
  ].filter(Boolean).join(" — ");
}

const COLS = [
  { k: "foto",       t: "",          fmt: v => v ? `<img src="${v}" loading="lazy">` : "", sort: false },
  { k: "titulo",     t: "Anúncio",   fmt: (v, r) => `<a href="${r.url}" target="_blank" rel="noopener">${v || r.url}</a>` +
                                                    (r.caracteristicas?.length ? `<div class="tags">${r.caracteristicas.join(" · ")}</div>` : "") },
  { k: "tipo",       t: "Tipo", ed: true },
  { k: "bairro",     t: "Bairro", ed: true },
  { k: "cond",       t: "Condomínio", ed: true, fmt: v => v ? `<span title="${condTitle(v).replace(/"/g, "&quot;")}">${v}</span>` : "" },
  { k: "quartos",    t: "Q",  m: "Quartos",   num: true, ed: true },
  { k: "suites",     t: "Su", m: "Suítes",    num: true, ed: true },
  { k: "banheiros",  t: "Ba", m: "Banheiros", num: true, ed: true },
  { k: "vagas",      t: "Vg", m: "Vagas",     num: true, ed: true },
  { k: "area_util",  t: "m²", m: "Área útil (m²)", num: true, ed: true, fmt: v => v ?? "" },
  { k: "preco",      t: "Preço", num: true, ed: true, fmt: v => v == null ? "" : "R$ " + v.toLocaleString("pt-BR") },
  { k: "rs_m2",      t: "R$/m²", num: true, fmt: v => v == null ? "" : Math.round(v).toLocaleString("pt-BR") },
  { k: "condominio", t: "Cond. R$", m: "Condomínio (R$)", num: true, ed: true, fmt: v => v == null ? "" : "R$ " + v.toLocaleString("pt-BR") },
];

// edição no browser: só quando aberto localmente (file:// ou localhost)
const LOCAL = location.protocol === "file:" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const NUM = new Set(["quartos", "suites", "banheiros", "vagas", "area_util", "area_total", "preco", "condominio", "iptu"]);

const lerOverrides = () => { try { return JSON.parse(localStorage.getItem("overrides")) || {}; } catch { return {}; } };

function construir() {
  const ov = lerOverrides();
  return (window.IMOVEIS || []).map(base => {
    const o = ov[base.url] || {};
    const r = { ...base, ...o };
    if (!("cond" in o)) r.cond = achaCond(r);
    r.rs_m2 = (r.preco && r.area_util) ? r.preco / r.area_util : null;
    return r;
  });
}

let dados = construir();

let ordem = { k: "rs_m2", dir: 1 };

const cab = document.getElementById("cab");
COLS.forEach(c => {
  const th = document.createElement("th");
  th.textContent = c.t;
  if (c.num) th.className = "num";
  if (c.sort !== false) th.onclick = () => {
    ordem.dir = ordem.k === c.k ? -ordem.dir : 1;
    ordem.k = c.k;
    render();
  };
  cab.appendChild(th);
});

const $ = id => document.getElementById(id);
["q", "quartos", "pmin", "pmax"].forEach(id => $(id).addEventListener("input", render));

const ord = $("ordenar");
COLS.filter(c => c.sort !== false).forEach(c => {
  ord.appendChild(new Option(c.t || c.k, c.k));
});
ord.onchange = () => { ordem.k = ord.value; ordem.dir = 1; render(); };

// categorias de cada imóvel: características do anúncio + amenidades do condomínio
function tagsDe(r) {
  const s = new Set((r.caracteristicas || []).map(t => t.toLowerCase().replace(/\s*24h?$/, "").trim()));
  const c = (window.CONDOMINIOS || []).find(c => c.nome === r.cond);
  if (c) for (const k in COND_AMEN) if (c[k] === true) s.add(COND_AMEN[k]);
  return s;
}

const cats = $("cats");
[...new Set(dados.flatMap(r => [...tagsDe(r)]))].sort((a, b) => a.localeCompare(b)).forEach(t => {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" value="${t}"> ${t}`;
  cats.appendChild(l);
});
cats.addEventListener("change", render);
const catsSel = () => [...cats.querySelectorAll("input:checked")].map(i => i.value);

if (LOCAL) {
  $("editbar").hidden = false;
  $("baixar").onclick = () => {
    const blob = JSON.stringify({ _comentario: "Correções manuais por URL. Rode scrape.mjs de novo para aplicar.", ...lerOverrides() }, null, 2);
    const a = document.createElement("a");
    a.href = "data:application/json;charset=utf-8," + encodeURIComponent(blob);
    a.download = "overrides.json";
    a.click();
  };
  $("limpar").onclick = () => {
    localStorage.removeItem("overrides");
    dados = construir();
    render();
  };
  $("corpo").addEventListener("focusout", e => {
    const td = e.target.closest("td[contenteditable]");
    if (!td) return;
    const url = td.parentElement.dataset.url, k = td.dataset.k;
    const txt = td.textContent.trim();
    let val = txt;
    if (NUM.has(k)) {
      const n = Number(txt.replace(/\./g, "").replace(",", ".").replace(/[^\d.-]/g, ""));
      val = txt === "" || Number.isNaN(n) ? null : n;
    }
    const ov = lerOverrides();
    ov[url] = { ...ov[url], [k]: val };
    localStorage.setItem("overrides", JSON.stringify(ov));
    dados = construir();
    render();
  });
}

function filtrar() {
  const q = $("q").value.trim().toLowerCase();
  const mq = +$("quartos").value || 0;
  const pmin = +$("pmin").value || 0;
  const pmax = +$("pmax").value || Infinity;
  const cs = catsSel();
  return dados.filter(r => {
    if (r.erro) return !q && !mq && !pmin && pmax === Infinity && !cs.length;
    if (q && !`${r.titulo} ${r.bairro} ${r.cond} ${r.tipo}`.toLowerCase().includes(q)) return false;
    if (cs.length) { const tg = tagsDe(r); if (!cs.every(t => tg.has(t))) return false; }
    if (mq && !(r.quartos >= mq)) return false;
    if (r.preco != null && (r.preco < pmin || r.preco > pmax)) return false;
    if (r.preco == null && (pmin || pmax !== Infinity)) return false;
    return true;
  });
}

function render() {
  [...cab.children].forEach((th, i) =>
    th.setAttribute("aria-sort", COLS[i].k === ordem.k ? (ordem.dir === 1 ? "ascending" : "descending") : "none"));
  ord.value = ordem.k;

  let linhas = filtrar();
  linhas.sort((a, b) => {
    const x = a[ordem.k], y = b[ordem.k];
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === "number" ? x - y : String(x).localeCompare(y)) * ordem.dir;
  });

  const corpo = document.getElementById("corpo");
  corpo.innerHTML = linhas.map(r => r.erro
    ? `<tr class="erro"><td></td><td><a href="${r.url}" target="_blank" rel="noopener">${r.url}</a></td><td colspan="${COLS.length - 2}">erro: ${r.erro}</td></tr>`
    : `<tr data-url="${r.url}">` + COLS.map(c => {
        const v = r[c.k];
        const editavel = LOCAL && c.ed;
        const val = editavel ? (v ?? "") : (c.fmt ? c.fmt(v, r) : (v ?? ""));
        const lbl = c.k === "titulo" ? "" : (c.m || c.t);
        return `<td class="${c.k}${c.num ? " num" : ""}"${lbl ? ` data-label="${lbl}"` : ""}${editavel ? ` contenteditable data-k="${c.k}"` : ""}>${val}</td>`;
      }).join("") + "</tr>"
  ).join("");

  const validos = linhas.filter(r => !r.erro && r.preco);
  const media = arr => arr.length ? arr.reduce((s, n) => s + n, 0) / arr.length : 0;
  document.getElementById("resumo").innerHTML =
    `<b>${linhas.filter(r => !r.erro).length}</b> imóveis · ` +
    `preço médio <b>R$ ${Math.round(media(validos.map(r => r.preco))).toLocaleString("pt-BR")}</b> · ` +
    `R$/m² médio <b>${Math.round(media(validos.filter(r => r.rs_m2).map(r => r.rs_m2))).toLocaleString("pt-BR")}</b>`;

  document.getElementById("vazio").hidden = dados.length > 0;
}

render();
</script>
</body>
</html>
