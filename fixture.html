<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Apartamento à venda no Centro | Imobiliária Exemplo</title>
  <meta property="og:title" content="Apartamento 3 quartos no Centro">
  <meta property="og:image" content="https://cdn.exemplo.com/fotos/ap123-01.jpg">
  <meta property="og:description" content="Ótimo apartamento no coração da cidade.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Apartamento 3 quartos no Centro",
    "description": "Apartamento reformado, andar alto, ensolarado.",
    "image": ["https://cdn.exemplo.com/fotos/ap123-01.jpg"],
    "offers": { "@type": "Offer", "price": "450000.00", "priceCurrency": "BRL" },
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Rua das Flores, 100",
      "addressLocality": "Cidade Exemplo"
    }
  }
  </script>
</head>
<body>
  <h1>Apartamento à venda no Centro</h1>
  <p>Bairro: Centro</p>
  <ul>
    <li>3 quartos, sendo 1 suíte</li>
    <li>2 banheiros</li>
    <li>1 vaga de garagem</li>
    <li>Área útil: 78 m²</li>
    <li>Área total: 95 m²</li>
  </ul>
  <p>Valor: R$ 450.000</p>
  <p>Condomínio: R$ 480,00</p>
  <p>IPTU: R$ 1.200,00</p>
  <p>Diferenciais: piscina, churrasqueira, elevador, sacada.</p>
</body>
</html>
